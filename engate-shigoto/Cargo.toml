[package]
name = "engate-shigoto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bridge — wrap engate Attach lifecycle as a shigoto RecordingJob with HistoryFetched + SubscriptionLive gates"

[lints]
workspace = true

[dependencies]
engate-types.workspace = true
engate-attach = { path = "../engate-attach", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# shigoto types + gate primitives
shigoto-types = "0.1"
shigoto-gate = "0.1"

# RecordingJob impl needs async_trait + tokio
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

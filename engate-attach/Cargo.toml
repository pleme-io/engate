[package]
name = "engate-attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed attach lifecycle (Spawned → Subscribed → Synced → Live) — engate's core machinery"

[lints]
workspace = true

[dependencies]
engate-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
typed-builder.workspace = true
drop_bomb.workspace = true

[dev-dependencies]
# Property testing for the attach contract.
proptest = "1"
# Loom is dev-only — `cargo test --features loom` exhaustively
# explores (spawn, subscribe, emit) interleavings. Always
# compiled-against in test mode; the `loom` feature flag toggles
# whether tests USE it (loom replaces std::sync primitives via
# cfg(loom) inside the test module).
loom = "0.7"

[features]
default = []
# Toggle for loom-based interleaving tests (cfg-flag, not a code dep).
loom = []
